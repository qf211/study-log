[pytest]
# 本地与 CI 共用的 pytest 参数（单一来源 —— 跟 requirements.txt 同一个思路）
# 本地直接跑 pytest 就能看到：详细用例名 + 覆盖率 + 生成 HTML 报告
addopts = -v --cov=web --cov-report=term-missing --html=reports/report.html --self-contained-html

# 自定义 marker 必须在这里注册，否则 pytest 会警告 unknown mark
markers =
    smoke: 冒烟用例（关键路径，提交前先跑这批）
    contract: 契约现状锁定（需求未定义，钉住当前行为）