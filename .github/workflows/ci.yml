name: CI
# 工作流的名字，GitHub Actions 页面显示用

on:
# 触发条件：什么时候跑这个工作流

  push:
  # 代码推送到远程仓库时触发

    branches: [ main ]
    # 只在 main 分支被推送时触发（避免其他分支的临时改动也跑）

  pull_request:
  # 有人发起 PR（合并请求）时也触发，合并前先验证

    branches: [ main ]

jobs:
# 任务列表：这个工作流要干哪些活

  test:
  # 任务名字（自己起），这里叫 test，表示跑测试

    runs-on: ubuntu-latest
    # 运行环境：GitHub 免费开一台最新的 Ubuntu 虚拟机
    # 每次触发都是全新机器，环境干净，不会受本地环境影响

    steps:
    # 步骤列表：从上到下一条条执行

      - name: 拉取代码
        uses: actions/checkout@v4
        # uses = 使用 GitHub 官方写好的现成动作
        # checkout = 把仓库里的代码拷到这台临时机器上

      - name: 安装 Python
        uses: actions/setup-python@v5
        # 官方动作：在这台机器上装指定版本的 Python
        with:
          python-version: '3.13'
          # with = 给这个动作传参数；这里指定版本 3.13

      - name: 安装依赖
        run: pip install -r requirements.txt
        # run = 直接执行命令（就像你在终端敲）
        # 依赖统一读 requirements.txt（单一事实来源）。
        # 之前这里是手敲 4 个包名，隐患是：本地装了新库（比如 pytest-cov）而这里忘了加，
        # CI 就会红——而且报错信息是 "unrecognized arguments"，很难联想到是依赖问题。
        # 现在本地和 CI 读同一份清单，不会再出现"两处清单不同步"。

      - name: 跑全部测试（覆盖率门禁）
        run: pytest --cov-fail-under=70
        # 通用参数写在 pytest.ini 里（本地与 CI 共用）：-v、覆盖率输出、HTML 报告
        # 这里额外加 --cov-fail-under=70 = 质量门禁：
        #   覆盖率低于 70% 时这一步返回非零退出码 → 整个工作流标红
        # 目的不是"卡数字"，而是防止覆盖率在后续开发里悄悄往下掉
        # （有人在这次改动里把覆盖率从 95% 干到 60%，CI 会当场拦住）

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        # if: always() = 不管前面成功还是失败都执行这一步
        # 因为**测试失败的时候，才最需要报告**——默认行为是前面失败就跳过后续步骤
        with:
          name: test-report
          path: reports/report.html
